<!doctype html>
<!-- Served by the CLI's local server after a browser sign-in. The MOD Duo icon matches the admin dashboard's; $color tints its LEDs and the heading. -->
<html>
<head>
  <meta charset="utf-8">
  <title>MOD CLI</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: #e5e7eb;
      font-family: system-ui, sans-serif;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 40px 48px;
      text-align: center;
      max-width: 420px;
    }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: 0.05em; color: #fff; margin: 16px 0 24px; }
    .brand span { color: #64D2FF; }
    h1 { font-size: 18px; margin: 0 0 8px; color: $color; }
    p { margin: 0; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 24 24" width="64" height="64" shape-rendering="crispEdges">
      <rect x="2" y="2" width="20" height="20" rx="2" fill="#262626"/>
      <rect x="4" y="4" width="7" height="5" fill="#64D2FF"/>
      <rect x="13" y="4" width="7" height="5" fill="#64D2FF"/>
      <rect x="6" y="5" width="3" height="3" fill="#3AAACF"/>
      <rect x="14" y="5" width="5" height="1" fill="#3AAACF"/>
      <rect x="14" y="7" width="5" height="1" fill="#3AAACF"/>
      <rect x="5" y="10" width="4" height="4" rx="1" fill="#050505"/>
      <rect x="15" y="10" width="4" height="4" rx="1" fill="#050505"/>
      <rect x="8" y="15" width="8" height="2" rx="1" fill="#C0C0C0"/>
      <rect x="6" y="18" width="3" height="3" rx="1" fill="#E0E0E0"/>
      <rect x="15" y="18" width="3" height="3" rx="1" fill="#E0E0E0"/>
      <rect x="4" y="18" width="1" height="1" fill="$color"/>
      <rect x="19" y="18" width="1" height="1" fill="$color"/>
      <rect x="4" y="15" width="1" height="1" fill="$color"/>
      <rect x="19" y="15" width="1" height="1" fill="$color"/>
    </svg>
    <div class="brand">MOD<span>CLI</span></div>
    <h1>$title</h1>
    <p>$message</p>
  </div>
</body>
</html>
