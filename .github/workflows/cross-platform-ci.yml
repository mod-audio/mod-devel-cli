name: Cross-platform CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest Python on every OS, the ones in between on Linux only
        os: [ubuntu-24.04, macos-latest, macos-15-intel, windows-latest]
        python-version: ['3.10', '3.14']
        include:
          - {os: ubuntu-24.04, python-version: '3.11'}
          - {os: ubuntu-24.04, python-version: '3.12'}
          - {os: ubuntu-24.04, python-version: '3.13'}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Verify installed version matches source
        run: |
          python -c "
          import re
          from importlib.metadata import version
          with open('pyproject.toml') as f:
              match = re.search(r'version\s*=\s*[\"'']([^\"'']+)[\"'']', f.read())
          expected = match.group(1)
          installed = version('mod-devel-cli')
          print(f'Expected: {expected}')
          print(f'Installed: {installed}')
          assert expected == installed, f'Version mismatch: {expected} != {installed}'
          "

      - name: Test CLI help
        run: modcli --help

      - name: Test auth commands
        run: modcli auth --help

      - name: Test bundle commands
        run: modcli bundle --help

      - name: Test config commands
        run: modcli config --help

      # Outside the checkout, so the tests import the installed package (and catch files it doesn't ship)
      - name: Run tests
        run: |
          cp -r tests pyproject.toml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP" && pytest

  uv-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, macos-15-intel, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install with uv
        run: uv tool install .

      - name: Test CLI help
        run: modcli --help

      - name: Test auth commands
        run: modcli auth --help

      - name: Test bundle commands
        run: modcli bundle --help

      - name: Test config commands
        run: modcli config --help

      # Outside the checkout, so the tests import the package as uv builds and installs it
      - name: Run tests
        run: |
          cp -r tests pyproject.toml "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP" && uvx --with "$GITHUB_WORKSPACE" pytest

  # The oldest versions pyproject.toml allows (click>=8.0) on the oldest Python
  lowest-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run --resolution lowest-direct --python 3.10 pytest

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run pylint
        run: uv run pylint --errors-only modcli tests
